<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kotae — Latihan Soal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="grammar.css?v=1">
<style>
:root{
  --bg:#070a14;--bg2:#0c1124;--nebula:#140f2e;
  --panel:rgba(15,19,38,.78);--panel2:rgba(22,28,54,.72);--solid:#0f1326;
  --edge:rgba(140,160,255,.14);--line:rgba(150,170,255,.16);
  --ink:#eaf0ff;--dim:#9aa6c8;--faint:#5d6788;
  --blue:#45b8ff;--pink:#ff4d97;--violet:#b06bff;--amber:#ffb547;--teal:#2fd3c9;
  --ok:#3ee6a8;--bad:#ff5c7a;--okbg:rgba(62,230,168,.12);--badbg:rgba(255,92,122,.12);
  --acc:var(--blue);
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --ui:"Space Grotesk","Zen Maru Gothic",system-ui,sans-serif;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}
:root[data-theme="light"]{
  --bg:#f3f5fc;--bg2:#e8ecf9;--nebula:#efe9ff;
  --panel:rgba(255,255,255,.88);--panel2:rgba(246,248,255,.95);--solid:#fff;
  --edge:rgba(60,80,160,.16);--line:rgba(60,80,160,.14);
  --ink:#141a33;--dim:#4d5878;--faint:#8a93ad;
  --blue:#1d86d6;--pink:#d8306f;--violet:#7444d6;--amber:#c27a00;--teal:#0f8f88;
  --ok:#0f9467;--bad:#d4364f;--okbg:rgba(15,148,103,.1);--badbg:rgba(212,54,79,.09);
  --shadow:0 16px 40px -24px rgba(30,40,90,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;
  background:
    radial-gradient(1100px 600px at 85% -10%,color-mix(in srgb,var(--violet) 22%,transparent),transparent 60%),
    radial-gradient(900px 500px at -10% 30%,color-mix(in srgb,var(--blue) 14%,transparent),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
}
:root[data-theme="dark"] body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 12%,#fff6,transparent),
    radial-gradient(1.5px 1.5px at 40% 70%,#fff5,transparent),radial-gradient(1px 1px at 88% 64%,#fff7,transparent),
    radial-gradient(1px 1px at 22% 86%,#fff5,transparent),radial-gradient(1px 1px at 58% 38%,#fff4,transparent);
}
a{color:inherit}
button{font:inherit;color:inherit}
.jp,.stem,.opt .t,.ptext,.ex .tr-jp{font-family:var(--jp)}
rt{font-size:.5em;color:var(--dim);font-weight:500;letter-spacing:0}
body.nofuri rt{visibility:hidden}
u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.32em;text-decoration-color:var(--acc)}

/* header */
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.2px}
.brand svg{width:34px;height:34px;flex:none}
.brand small{display:block;font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.crumb{flex:1;min-width:0;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--ink)}
.tog{display:flex;gap:6px}
.tbtn{height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--dim)}
.tbtn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--acc) 50%,var(--edge))}
.tbtn.on{color:var(--ink);border-color:color-mix(in srgb,var(--acc) 60%,var(--edge));background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
.tbtn svg{width:16px;height:16px}
main{max-width:1180px;margin:0 auto;padding:22px 16px 90px}

/* generic */
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--shadow)}
.muted{color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--edge);color:var(--dim);background:var(--panel2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:13px;border:1px solid var(--edge);
  background:var(--panel2);cursor:pointer;font-weight:600;text-decoration:none;transition:transform .15s,border-color .15s,background .15s}
.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--acc) 55%,var(--edge))}
.btn.pri{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 85%,#fff 0%),color-mix(in srgb,var(--violet) 80%,var(--acc)));border-color:transparent;color:#05070f}
:root[data-theme="light"] .btn.pri{color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px}
h1,h2,h3{margin:0;line-height:1.25}

/* home */
.hero{padding:26px 4px 18px}
.hero h1{font-size:clamp(28px,4.4vw,44px);font-weight:700;letter-spacing:-.5px}
.hero h1 span{background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:640px;color:var(--dim);margin:10px 0 0}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.bcard{position:relative;display:block;padding:20px;text-decoration:none;overflow:hidden;transition:transform .2s,border-color .2s}
.bcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--edge))}
.bcard .cover{display:flex;gap:16px;align-items:center}
.bcard .book-cover{width:72px;height:104px;object-fit:contain;flex:none;border-radius:3px;background:#fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.4)}
.bcard .spine{width:64px;height:86px;border-radius:8px 14px 14px 8px;flex:none;position:relative;
  background:linear-gradient(160deg,#2ccf9a,#118a6a);box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 10px 24px -10px rgba(0,0,0,.6);
  display:grid;place-items:center;color:#fff;font-family:var(--jp);font-weight:900;font-size:22px}
.bcard .spine small{position:absolute;bottom:6px;font-size:9px;font-family:var(--ui);letter-spacing:.5px;opacity:.85}
.bcard h3{font-family:var(--jp);font-size:18px}
.bcard .meta{color:var(--dim);font-size:13px;margin-top:4px}
.bcard .bar{margin-top:16px}
.bcard.add{display:grid;place-items:center;min-height:150px;border-style:dashed;color:var(--faint);text-align:center;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-top:8px}
.stats b{color:var(--ink);font-weight:600}

/* book */
.bhead{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;padding:6px 2px 18px}
.bhead h1{font-family:var(--jp);font-size:clamp(22px,3vw,30px)}
.bhead .acts{display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--edge);background:var(--panel);cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;font-family:var(--jp);font-weight:700;font-size:14px;color:var(--dim)}
.tab .n{font-family:var(--ui);font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--line)}
.tab.on{color:var(--ink);border-color:color-mix(in srgb,var(--acc) 60%,var(--edge));background:color-mix(in srgb,var(--acc) 15%,var(--panel))}
.part{margin-top:18px}
.part h2{font-family:var(--jp);font-size:17px;display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.part h2 .pill{font-family:var(--ui)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.set{display:block;padding:14px 14px 12px;border-radius:16px;text-decoration:none;background:var(--panel);border:1px solid var(--edge);transition:transform .15s,border-color .15s}
.set:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 55%,var(--edge))}
.set .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.set .l b{font-family:var(--jp);font-size:15px}
.set .l span{font-size:12px;color:var(--faint)}
.set .sc{font-size:12px;color:var(--dim);margin-top:2px}
.set .sc b{color:var(--ok)}
.qstrip{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
.qstrip i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.qstrip i.g{background:var(--ok)}.qstrip i.r{background:var(--bad)}
.sec-actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 2px 4px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qtop .back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--edge);background:var(--panel);text-decoration:none;flex:none}
.qtop .back svg{width:18px;height:18px}
.qtop .tt{min-width:0;flex:1}
.qtop .tt small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtop .tt b{font-family:var(--jp);font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{flex:none;font-size:13px;color:var(--dim);text-align:right}
.score b{display:block;font-size:20px;color:var(--ink);line-height:1.1}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.dot{width:32px;height:32px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);cursor:pointer;font-size:12px;color:var(--dim);padding:0}
.dot.g{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok)}
.dot.r{background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}
.dot.cur{outline:2px solid var(--acc);outline-offset:2px;color:var(--ink)}
.qgrid{display:grid;gap:16px;align-items:start}
.qgrid.wp{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.passage{position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;overflow:hidden}
.passage .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
.passage .ph b{color:var(--ink);font-family:var(--jp)}
.passage .ph button{border:0;background:none;color:var(--dim);cursor:pointer;display:none}
.ptext{padding:16px 20px 22px;overflow:auto;font-size:17px;line-height:2.15}
.ptext p{margin:0 0 .3em;text-indent:1em}
.ptext p.c{text-align:center;text-indent:0;font-weight:700}
.ptext p.r{text-align:right;text-indent:0}
.ptext p.img{text-indent:0;margin-top:8px}
.ptext img{width:100%;height:auto;border-radius:10px;background:#fff;display:block}
.ptext a.zoom{display:block;cursor:zoom-in}
.ptext .intro{color:var(--dim);font-size:14px;text-indent:0;margin-bottom:.6em}
.qcard{padding:22px 22px 20px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qnum{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--acc) 18%,var(--panel2));border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.qtag{font-family:var(--jp);font-weight:700}
.qpage{margin-left:auto;font-size:12px;color:var(--faint)}
.instr{font-size:13px;color:var(--dim);margin:0 0 16px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.instr .jp{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
.ulb{display:inline-block;width:2.4em;border-bottom:1.5px solid currentColor;vertical-align:.1em;margin:0 .15em}
.stem{font-size:clamp(18px,2.3vw,22px);line-height:2.2;margin:4px 0 18px;word-break:break-word}
.stem.word{font-size:clamp(26px,4vw,34px);font-weight:700;line-height:1.6}
.slot{display:inline-block;min-width:3.4em;height:1.3em;border-bottom:2px solid var(--ink);margin:0 .22em;vertical-align:-.25em;text-align:center;line-height:1.3em}
.slot.star{color:var(--pink);font-weight:900}
.slot.fill{min-width:0;height:auto;line-height:inherit;padding:0 .35em;border-bottom-color:var(--ok);border-radius:4px 4px 0 0;background:var(--okbg);vertical-align:baseline}
.slot.fill.star{background:color-mix(in srgb,var(--pink) 18%,transparent);border-bottom-color:var(--pink);color:var(--ink)}
.slot.num{min-width:0;height:auto;line-height:1.5;border:1.5px solid var(--dim);border-radius:7px;padding:0 .5em;font-family:var(--ui);font-weight:700;font-size:.82em;vertical-align:.08em;margin:0 .15em}
.slot.num.cur{border-color:var(--pink);color:var(--pink);box-shadow:0 0 0 4px color-mix(in srgb,var(--pink) 20%,transparent)}
.slot.num i{font-style:normal;font-family:var(--jp);font-weight:700;margin-left:.4em;color:var(--ok)}
.blank{display:inline-block;min-width:4.6em;height:1.35em;border:1.5px solid var(--dim);border-radius:8px;vertical-align:-.3em;margin:0 .2em}
.blank.fill{min-width:0;height:auto;line-height:inherit;padding:0 .4em;border-color:var(--ok);background:var(--okbg);vertical-align:baseline}
.opts{display:grid;gap:10px}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 15px;border-radius:15px;border:1px solid var(--edge);
  background:var(--panel2);cursor:pointer;transition:transform .12s,border-color .12s,background .12s;font-size:17px;line-height:2}
.opt:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--acc) 60%,var(--edge))}
.opt .k{flex:none;width:28px;height:28px;margin-top:5px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--ui);
  background:var(--line);color:var(--dim)}
.opt .t{flex:1;min-width:0}
.opt .ic{flex:none;width:22px;height:22px;margin-top:8px;display:none}
.done .opt{cursor:default}.done .opt:hover{transform:none}
.opt.right{border-color:color-mix(in srgb,var(--ok) 70%,transparent);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#04130d}
.opt.right .ic.y{display:block;color:var(--ok)}
.opt.wrong{border-color:color-mix(in srgb,var(--bad) 70%,transparent);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#1a0509}
.opt.wrong .ic.n{display:block;color:var(--bad)}
.done .opt.dim{opacity:.55}
.verdict{display:flex;align-items:center;gap:12px;margin:18px 0 0;padding:14px 16px;border-radius:15px;font-weight:600}
.verdict svg{width:26px;height:26px;flex:none}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--badbg);color:var(--bad)}
.verdict span{color:var(--ink);font-weight:500}
.verdict .jp{font-weight:700}
.ex{margin-top:14px;display:grid;gap:12px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ex h4{margin:0 0 4px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:600}
.ex .box{padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);line-height:1.7}
.ex .box b{color:color-mix(in srgb,var(--acc) 75%,var(--ink))}
.ex .full{font-family:var(--jp);font-size:17px;line-height:2.1}
.olist{display:grid;gap:8px}
.orow{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);line-height:1.65;font-size:14.5px}
.orow .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--dim)}
.orow.right{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.orow.right .k{background:var(--ok);color:#04130d}
.orow.mine:not(.right){border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.orow.mine:not(.right) .k{background:var(--bad);color:#1a0509}
.orow .ot{font-family:var(--jp);font-weight:700;font-size:15px;display:block;line-height:1.9}
.orow .tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;font-family:var(--ui)}
.orow .tag.y{background:var(--okbg);color:var(--ok)}.orow .tag.m{background:var(--badbg);color:var(--bad)}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.order .c{padding:3px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-family:var(--jp);font-weight:700}
.order .c.s{border-color:var(--pink);color:var(--pink)}
.order .ar{color:var(--faint)}
.aud{margin:0 0 16px;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;gap:10px}
.aud .ic{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.aud .ic svg{width:18px;height:18px}
.aud audio{flex:1;min-width:0;width:100%;height:40px}
.qimg{margin:0 0 18px}
.qimg img{display:block;max-width:100%;max-height:420px;height:auto;border-radius:12px;background:#fff;margin:0 auto}
.ex details.scr summary{cursor:pointer;margin:0 0 4px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:600}
.ex .scr .box{font-family:var(--jp);font-size:15.5px;line-height:2}
.opt.used{opacity:.35;pointer-events:none}
.slot.pick{min-width:0;height:auto;line-height:inherit;padding:0 .35em;border-bottom-color:var(--acc);border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--acc) 16%,transparent);vertical-align:baseline;cursor:pointer}
.narh{font-size:13px;color:var(--dim);margin:-8px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.narh button{border:1px solid var(--edge);background:var(--panel2);border-radius:9px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.qnav{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.qnav .btn{flex:1}
.kbd{font-size:12px;color:var(--faint);text-align:center;margin-top:10px}
.kbd kbd{font-family:var(--ui);padding:1px 6px;border-radius:6px;border:1px solid var(--edge);background:var(--panel2)}

/* summary */
.sum{padding:28px;text-align:center;max-width:720px;margin:0 auto}
.ring{width:150px;height:150px;margin:6px auto 14px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:34px}
.ring b small{display:block;font-size:13px;color:var(--dim);font-weight:500;margin-top:-34px}
.sum h2{font-size:24px}
.sum .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.slist{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:22px;text-align:left}
.slist a{min-width:0;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-decoration:none;font-family:var(--jp);font-size:14.5px}
.slist a .m{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-family:var(--ui);font-size:12px;font-weight:700}
.slist a .m.g{background:var(--okbg);color:var(--ok)}.slist a .m.r{background:var(--badbg);color:var(--bad)}
.slist a .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* mistake analysis */
.an-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:4px 0 6px}

.an-sec>h2{font-size:17px;margin:0 2px 4px}

.skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.wk{display:grid;gap:8px}
.wk .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--edge)}
.wk .nm{min-width:0;font-weight:700}
.wk .nm small{font-weight:500;font-size:12.5px;color:var(--dim);margin-left:6px}
.wk .ct{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.wk .bar{grid-column:1/-1}
.wk .btn{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.mlist{display:grid;gap:6px}
.mlist a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-decoration:none}
.mlist a:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.mlist .x{min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mlist .st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.mlist .st.r{background:var(--badbg);color:var(--bad)}.mlist .st.g{background:var(--okbg);color:var(--ok)}

.ai{padding:18px 20px;margin-top:22px}

.aimeta{font-size:12.5px;margin:14px 0 0}
.aisum{font-size:15.5px;line-height:1.7;margin:8px 0 0}

.aifokus,.airen{margin:0;padding-left:22px;display:grid;gap:8px;line-height:1.6;font-size:14.5px}
.aierr{color:var(--bad);margin:14px 0 0}
.aiq{padding:12px 14px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--violet) 45%,var(--line));background:color-mix(in srgb,var(--violet) 6%,var(--panel2))}
.aiq .aiqh{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.aiq .aiqh span{font-size:13px}

.aiqout:empty{display:none}

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const KEY = 'kotae:v1';

/* ---------- storage ---------- */
let DB = { prefs: {}, hist: {}, sets: {} };
try { Object.assign(DB, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} };

/* ---------- prefs ---------- */
function applyPrefs() {
  const theme = DB.prefs.theme || 'light';
  document.documentElement.dataset.theme = theme;
  $('#themeBtn').innerHTML = `<svg><use href="#i-${theme === 'dark' ? 'sun' : 'moon'}"/></svg>`;
  const furi = DB.prefs.furi !== false;
  document.body.classList.toggle('nofuri', !furi);
  $('#furiBtn').classList.toggle('on', furi);
}
$('#themeBtn').onclick = () => { DB.prefs.theme = (DB.prefs.theme || 'light') === 'dark' ? 'light' : 'dark'; save(); applyPrefs(); };
$('#furiBtn').onclick = () => { DB.prefs.furi = DB.prefs.furi === false; save(); applyPrefs(); };
applyPrefs();

/* ---------- question types ---------- */
const UL = '<span class="ulb"></span>';
const TYPES = {
  kanji:    { tag: '漢字読み', id: 'Cara baca kanji', jp: `${UL}のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。`, how: 'Pilih cara baca yang benar untuk kata bergaris bawah.' },
  hyouki:   { tag: '表記', id: 'Penulisan kanji', jp: `${UL}のことばを漢字で書くとき、最もよいものを、1・2・3・4から一つえらびなさい。`, how: 'Pilih penulisan kanji yang benar untuk kata bergaris bawah.' },
  bunmyaku: { tag: '文脈規定', id: 'Kata yang pas', jp: '（　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。', how: 'Pilih kata yang paling pas untuk mengisi kotak kosong.' },
  iikae:    { tag: '言い換え類義', id: 'Padanan arti', jp: `${UL}に意味が最も近いものを、1・2・3・4から一つえらびなさい。`, how: 'Pilih yang artinya paling dekat dengan bagian bergaris bawah.' },
  youhou:   { tag: '用法', id: 'Pemakaian kata', jp: 'つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。', how: 'Pilih kalimat yang memakai kata ini dengan benar.' },
  bunpou:   { tag: '文法形式', id: 'Bentuk tata bahasa', jp: 'つぎの文の（　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。', how: 'Pilih bentuk tata bahasa yang tepat untuk kotak kosong.' },
  star:     { tag: '並べ替え ★', id: 'Susun kalimat', jp: 'つぎの文の ★ に入る最もよいものを、1・2・3・4から一つえらびなさい。', how: 'Susun keempat potongan jadi kalimat yang benar, lalu pilih potongan yang jatuh di ★.' },
  cloze:    { tag: '文章の文法', id: 'Tata bahasa dalam teks', jp: '文章全体の内容を考えて、□の中に入る最もよいものを、1・2・3・4から一つえらびなさい。', how: 'Baca teksnya, lalu pilih yang paling cocok untuk kotak bernomor yang menyala.' },
  dokkai:   { tag: '読解', id: 'Pemahaman bacaan', jp: '文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。', how: 'Baca teksnya, lalu jawab pertanyaannya.' },
  erabu:    { tag: 'れんしゅう', id: 'Pilih yang benar', jp: '正しいほうに○をつけなさい。', how: 'Pilih yang benar dari dua pilihan.', ab: 1 },
  yomi:     { tag: '読み', id: 'Cara baca', jp: '正しい読みに○をつけなさい。', how: 'Pilih cara baca yang benar untuk kata ini.' },
  kaki:     { tag: '書き', id: 'Penulisan kanji', jp: '正しい漢字に○をつけなさい。', how: 'Pilih penulisan kanji yang benar untuk kata ini.' },
  maru:     { tag: '○×', id: 'Benar atau salah', jp: '次の文章を読んで、後の文が正しいかどうか考えよう。', how: 'Baca teksnya, lalu tentukan apakah pernyataan ini sesuai (○) atau tidak (×).' },
  setsumei: { tag: '説明', id: 'Kata sesuai penjelasan', jp: '説明に最もあうことばを、1・2・3・4から一つえらびなさい。', how: 'Baca penjelasannya, lalu pilih kata yang paling cocok dengan penjelasan itu.' },
  gokei:    { tag: '語形成', id: 'Pembentukan kata', jp: '（　　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。', how: 'Pilih kanji/imbuhan yang bergabung dengan kata di sebelahnya menjadi kata yang benar.' },
  narabe:   { tag: '並べ替え', id: 'Susun kalimat', jp: '下の語を並べ替えて正しい文を作りなさい。', how: 'Ketuk keempat potongan sesuai urutan yang benar. Ketuk potongan yang sudah terpasang untuk melepasnya.' },
  kiku:     { tag: '聴解れんしゅう', id: 'Latihan mendengar', jp: 'CDを聞いて、正しいものを選んでください。', how: 'Putar audionya, lalu pilih jawaban yang benar.' },
  kadai:    { tag: '課題理解', id: 'Memahami tugas', jp: 'まず質問を聞いてください。それから話を聞いて、1から4の中から、最もよいものを一つえらんでください。', how: 'Dengarkan pertanyaan lalu percakapannya: apa yang harus dilakukan orang itu?' },
  point:    { tag: 'ポイント理解', id: 'Menangkap poin', jp: 'まず質問を聞いてください。そのあと、せんたくしを読んでください。それから話を聞いて、1から4の中から、最もよいものを一つえらんでください。', how: 'Dengarkan pertanyaannya, baca pilihannya, lalu cari poin yang ditanyakan di percakapan.' },
  gaiyou:   { tag: '概要理解', id: 'Memahami garis besar', jp: '問題用紙に何もいんさつされていません。話を聞いて、質問とせんたくしを聞いて、1から4の中から、最もよいものを一つえらんでください。', how: 'Pilihannya hanya dibacakan di audio. Tangkap isi besar pembicaraannya.' },
  hatsuwa:  { tag: '発話表現', id: 'Ungkapan yang tepat', jp: '絵を見ながら質問を聞いてください。やじるし（→）の人は何と言いますか。1から3の中から、最もよいものを一つえらんでください。', how: 'Lihat gambarnya; pilih ucapan yang tepat untuk orang yang ditunjuk panah. Pilihannya dibacakan di audio.' },
  sokuji:   { tag: '即時応答', id: 'Tanggapan cepat', jp: '問題用紙に何もいんさつされていません。まず文を聞いてください。それから、その返事を聞いて、1から3の中から、最もよいものを一つえらんでください。', how: 'Dengarkan kalimatnya, lalu pilih tanggapan yang paling pas. Pilihannya dibacakan di audio.' },
};
const SEC_ACC = { v: 'var(--blue)', g: 'var(--pink)', r: 'var(--violet)', m1: 'var(--amber)', m2: 'var(--amber)',
  w1: 'var(--blue)', w2: 'var(--pink)', w3: 'var(--violet)', w4: 'var(--amber)', k: 'var(--amber)', l: 'var(--teal)' };
const SEC_ID = { v: 'Kosakata', g: 'Tata bahasa', r: 'Bacaan', m1: 'Ujian simulasi', m2: 'Ujian simulasi',
  w1: 'Minggu 1', w2: 'Minggu 2', w3: 'Minggu 3', w4: 'Minggu 4', k: 'Kanji', l: 'Mendengarkan' };
const typeOf = (B, q) => (B.types && B.types[q.type]) || TYPES[q.type] || TYPES.dokkai;
// option labels (a/b for 正しいほう items), right-answer test (q.alt = other accepted answers; narabe: ans is the order string)
const lab = (q, k) => (TYPES[q.type] || {}).ab ? 'abcd'[k] : String(k + 1);
const isOk = (q, a) => a != null && (a === q.ans || (q.alt || []).includes(a));
const ansText = q => q.type === 'narabe' ? q.order.split('').map(d => strip(q.opts[+d - 1])).join(' › ') : strip(q.opts[q.ans - 1]);

/* ---------- books ---------- */
const BOOKS = window.KOTAE_BOOKS || [];
const loaded = {};
function loadBook(id) {
  if (loaded[id]) return Promise.resolve(loaded[id]);
  const meta = BOOKS.find(b => b.id === id);
  if (!meta) return Promise.reject(new Error('Buku tidak ditemukan'));
  const ready = () => (loaded[id] = indexBook(window.KOTAE_DATA[id], meta));
  if (window.KOTAE_DATA && window.KOTAE_DATA[id]) return Promise.resolve(ready());
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = meta.file + '?v=' + (meta.v || 1);
    s.onload = () => res(ready());
    s.onerror = () => rej(new Error('Gagal memuat ' + meta.file));
    document.head.appendChild(s);
  });
}
function indexBook(data, meta) {
  // the app shows the romaji title from books.js; the Japanese original stays as a tooltip
  const B = { ...data, title: meta.title || data.title, jp: meta.jp || data.title, meta, q: {}, set: {}, all: [] };
  for (const sec of data.sections) for (const part of sec.parts) for (const st of part.sets) {
    st.sec = sec; st.part = part;
    B.set[st.id] = st;
    for (const q of st.qs) { q.set = st; B.q[q.id] = q; B.all.push(q); }
  }
  return B;
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = h => h.replace(/<rt>.*?<\/rt>/g, '').replace(/<[^>]+>/g, '');
const histOf = q => DB.hist[q.id];
// first attempt {c, ok, t} of a history entry; null for an older entry answered several times before f existed
const firstOf = h => h.f !== undefined ? h.f : h.n === 1 ? { c: h.c, ok: h.ok, t: h.t } : null;
// a mistake on the first try (for older multi-try entries only the latest answer is known)
const missedFirst = h => { const f = firstOf(h); return f ? !f.ok : !h.ok; };
function statOf(qs) {
  let g = 0, r = 0;
  for (const q of qs) { const h = DB.hist[q.id]; if (h) h.ok ? g++ : r++; }
  return { g, r, n: qs.length };
}
function bar(st) {
  const pct = x => (st.n ? (100 * x / st.n) : 0).toFixed(2) + '%';
  return `<div class="bar"><i class="g" style="width:${pct(st.g)}"></i><i class="r" style="width:${pct(st.r)}"></i></div>`;
}
const pagesLabel = p => !p || !p.length ? '' : 'hlm. ' + (p.length > 1 ? `${p[0]}–${p[p.length - 1]}` : p[0]);
function setCrumb(parts) { $('#crumb').innerHTML = parts.join(' <span class="muted">/</span> '); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- router ---------- */
let S = null;          // current quiz session
window.addEventListener('hashchange', route);
function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  window.scrollTo(0, 0);
  if (!h[0]) return home();
  if (h[0] === 'g') return loadBook(h[1]).then(B => grammarView(B, h[2])).catch(fail);
  if (h[0] === 'b') return loadBook(h[1]).then(B => bookView(B, h[2])).catch(fail);
  if (h[0] === 's') return loadBook(h[1]).then(B => startSet(B, h[2])).catch(fail);

  if (h[0] === 'a') return analysisView(h[1]);

const grammarLoaded = {};
function loadGrammar(B) {
  if (grammarLoaded[B.id]) return grammarLoaded[B.id];
  grammarLoaded[B.id] = new Promise((res, rej) => {
    if (window.KOTAE_GRAMMAR && window.KOTAE_GRAMMAR[B.id]) return res(window.KOTAE_GRAMMAR[B.id]);
    const script = document.createElement('script');
    script.src = B.meta.grammar.file + '?v=' + B.meta.grammar.v;

    script.onerror = () => { delete grammarLoaded[B.id]; rej(new Error('Gagal memuat rangkuman grammar')); };

  return grammarLoaded[B.id];
}

/* ---------- sessions ---------- */
function newSession(B, qs, title, crumb, back, setId) {
  // show the book's own numbers on the dots only when they are unique within the session
  const bookNums = !!setId && new Set(qs.map(q => q.n)).size === qs.length;
  S = { B, qs, i: 0, ans: {}, part: {}, title, crumb, back, setId, bookNums };
  renderQ();
}
function startSet(B, setId) {
  const st = B.set[setId];
  if (!st) return fail('Set tidak ditemukan');
  newSession(B, st.qs, `${st.part.title} · ${st.label}`, st.sec.title, `#/b/${B.id}/${st.sec.id}`, setId);
}
function startWrong(B) {
  const qs = B.all.filter(q => DB.hist[q.id] && !DB.hist[q.id].ok);
  if (!qs.length) { app.innerHTML = `<div class="empty">Belum ada soal yang salah. Mantap!<br><br><a class="btn" href="#/b/${B.id}">Kembali</a></div>`; return; }
  newSession(B, qs, `Ulas yang salah (${qs.length})`, B.title, `#/b/${B.id}`, null);
}
function startMix(B, secId) {
  const sec = B.sections.find(s => s.id === secId) || B.sections[0];
  const qs = shuffle(sec.parts.flatMap(p => p.sets.flatMap(st => st.qs))).slice(0, 20);
  newSession(B, qs, `Acak 20 soal · ${sec.title}`, B.title, `#/b/${B.id}/${sec.id}`, null);
}
function startMistakes(B, filter) {       // first-try mistakes, newest first; t:<type> / p:<part> narrow it, @<id> opens at that question
  const rows = mistakeRows([B]).filter(r => r.miss).sort((a, b) => b.t - a.t);
  let qs = rows.map(r => r.q), title = 'Salah di percobaan pertama', at = 0;
  const f = filter || '';
  if (f.startsWith('t:')) { qs = qs.filter(q => q.type === f.slice(2)); if (qs[0]) title += ' · ' + typeOf(B, qs[0]).tag; }
  else if (f.startsWith('p:')) { qs = qs.filter(q => q.set.part.id === f.slice(2)); if (qs[0]) title += ' · ' + qs[0].set.part.title; }
  else if (f.startsWith('@')) at = Math.max(0, qs.findIndex(q => q.id === f.slice(1)));
  if (!qs.length) { app.innerHTML = `<div class="empty">Tidak ada kesalahan untuk dilatih.<br><br><a class="btn" href="#/a/${B.id}">Kembali</a></div>`; return; }
  newSession(B, qs, `${title} (${qs.length})`, B.title, `#/a/${B.id}`, null);
  if (at) { S.i = at; renderQ(); }
}

/* ---------- mistake analysis ---------- */
// skill buckets: built-in types map directly; a book's own types fall back to its section / part title
const TYPE_SKILL = { kanji: 'Kanji', hyouki: 'Kanji', yomi: 'Kanji', kaki: 'Kanji',
  bunmyaku: 'Kosakata', iikae: 'Kosakata', youhou: 'Kosakata', setsumei: 'Kosakata', gokei: 'Kosakata',
  bunpou: 'Tata bahasa', star: 'Tata bahasa', cloze: 'Tata bahasa', narabe: 'Tata bahasa', dokkai: 'Bacaan', maru: 'Bacaan',
  kiku: 'Mendengar', kadai: 'Mendengar', point: 'Mendengar', gaiyou: 'Mendengar', hatsuwa: 'Mendengar', sokuji: 'Mendengar' };
function skillOf(B, q) {
  if (!(B.types && B.types[q.type]) && TYPE_SKILL[q.type]) return TYPE_SKILL[q.type];
  const s = q.set.sec.title + ' ' + q.set.part.title;
  return /聴|聞|ちょうかい/.test(s) ? 'Mendengar' : /読解|読む|どっかい/.test(s) ? 'Bacaan' : /漢字|かんじ/.test(s) ? 'Kanji'
    : /文法|ぶんぽう|助詞|活用/.test(s) ? 'Tata bahasa' : /語彙|文字|ことば|もじ|ごい/.test(s) ? 'Kosakata' : 'Lainnya';
}
function mistakeRows(Bs) {               // one row per question answered in this browser
  const rows = [];
  for (const B of Bs) for (const q of B.all) {
    const h = DB.hist[q.id];
    if (!h || h.b !== B.id) continue;
    const f = firstOf(h), miss = missedFirst(h);
    rows.push({ B, q, h, f, miss, fixed: miss && !!h.ok, rep: (h.w || 0) >= 2, skill: skillOf(B, q), T: typeOf(B, q), t: (f && f.t) || h.t });
  }
  return rows;
}
function groupRows(rows, keyOf) {        // most first-try mistakes first, then the lowest first-try accuracy
  const m = new Map();
  for (const r of rows) { const k = keyOf(r), g = m.get(k) || { k, r, n: 0, miss: 0 }; g.n++; if (r.miss) g.miss++; m.set(k, g); }
  return [...m.values()].sort((a, b) => b.miss - a.miss || a.miss / a.n - b.miss / b.n);
}
const snip = (B, q, len = 90) => (q.type === 'cloze' && q.passage ? `${(B.passages[q.passage] || {}).label || 'Teks'} · kotak ${q.n}` : strip(q.stem)).replace(/\s+/g, ' ').trim().slice(0, len);
const pickText = (q, c) => c == null ? '—' : q.type === 'narabe' ? String(c).split('').map(d => strip(q.opts[+d - 1] || '')).join(' › ') : `${lab(q, c - 1)}. ${strip(q.opts[c - 1] || '')}`;
const keyText = q => q.type === 'narabe' ? ansText(q) : `${lab(q, q.ans - 1)}. ${ansText(q)}`;
const histBooks = () => BOOKS.filter(b => Object.values(DB.hist).some(h => h.b === b.id));

let AN = null;                           // the analysis on screen (rows + scope), reused by the AI button
function analysisView(scope) {
  S = null;
  app.innerHTML = '<div class="empty">Menyiapkan analisis…</div>';
  const ids = scope ? [scope] : histBooks().map(b => b.id);
  Promise.all(ids.map(loadBook)).then(Bs => renderAnalysis(scope, Bs)).catch(fail);
}
function renderAnalysis(scope, Bs) {
  const B0 = scope ? Bs[0] : null;
  document.documentElement.style.setProperty('--acc', 'var(--pink)');
  setCrumb([`<a href="#/">Kotae</a>`, ...(B0 ? [`<a href="#/b/${B0.id}">${esc(B0.title)}</a>`] : []), 'Analisis kesalahan']);
  const rows = mistakeRows(Bs), miss = rows.filter(r => r.miss);
  AN = { scope: scope || 'all', rows, miss };
  const known = rows.filter(r => r.f), firstOk = known.filter(r => r.f.ok).length, fixed = miss.filter(r => r.fixed).length;
  const tabs = `<nav class="tabs"><a class="tab ${scope ? '' : 'on'}" href="#/a">Semua buku</a>${histBooks().map(b =>
    `<a class="tab ${b.id === scope ? 'on' : ''}" href="#/a/${b.id}" title="${esc(b.jp || '')}">${esc(b.title)}</a>`).join('')}</nav>`;
  const head = `<div class="bhead"><div><h1>Analisis kesalahan</h1>
      <div class="stats"><span>${B0 ? esc(B0.title) : 'Semua buku'} · dihitung dari jawaban <b>pertama</b> tiap soal, jadi kesalahan tetap tercatat walau sudah kamu perbaiki.</span></div></div>
    ${B0 ? `<div class="acts"><a class="btn" href="#/m/${B0.id}" ${miss.length ? '' : 'disabled'}><svg><use href="#i-redo"/></svg>Latih semua kesalahan (${miss.length})</a></div>` : ''}</div>`;
  if (!rows.length) {
    app.innerHTML = head + tabs + `<div class="panel empty">Belum ada jawaban yang tercatat${B0 ? ' untuk buku ini' : ''} di browser ini.<br>Progres tersimpan per browser, jadi buka Kotae di browser tempat kamu biasa latihan.</div>`;
    return;
  }
  const tile = (v, l, c = '') => `<div class="panel an-tile ${c}"><b>${v}</b><span>${l}</span></div>`;
  const tiles = `<div class="an-tiles">${tile(rows.length, 'soal dicoba')}${tile(known.length ? Math.round(100 * firstOk / known.length) + '%' : '—', 'benar di percobaan pertama', 'g')}
    ${tile(miss.length, 'salah di percobaan pertama', 'r')}${tile(fixed, 'sudah kamu perbaiki')}${tile(miss.length - fixed, 'masih salah')}${tile(rows.filter(r => r.rep).length, 'salah 2× atau lebih')}</div>`;
  const pct = g => Math.round(100 * (g.n - g.miss) / g.n);
  const skills = `<div class="skills">${groupRows(rows, r => r.skill).map(g => `<span class="pill">${esc(g.k)} <b>${pct(g)}%</b> · ${g.miss} salah dari ${g.n}</span>`).join('')}</div>`;
  const wkRow = (g, name, href) => `<div class="row"><div class="nm">${name}</div>
      <div class="ct">${g.miss} salah dari ${g.n} · ${pct(g)}% benar ${href ? `<a class="btn" href="${href}">Latih</a>` : ''}</div>
      ${bar({ g: g.n - g.miss, r: g.miss, n: g.n })}</div>`;
  const types = groupRows(rows, r => r.T.tag + '|' + r.T.id).filter(g => g.miss).slice(0, 8)
    .map(g => wkRow(g, `<span class="jp">${esc(g.r.T.tag)}</span><small>${esc(g.r.T.id)}</small>`, B0 ? `#/m/${B0.id}/t:${encodeURIComponent(g.r.q.type)}` : '')).join('');
  const parts = B0 ? groupRows(rows, r => r.q.set.part.id).filter(g => g.miss).slice(0, 6)
    .map(g => wkRow(g, `<span class="jp">${esc(g.r.q.set.sec.title)} · ${esc(g.r.q.set.part.title)}</span>`, `#/m/${B0.id}/p:${encodeURIComponent(g.k)}`)).join('') : '';
  const item = r => `<a href="#/m/${r.B.id}/@${encodeURIComponent(r.q.id)}">
      <span class="x jp">${esc(snip(r.B, r.q))}</span>

const aiRest = {};
async function gemini(system, user) {
  const C = window.KOTAE_AI || {}, keys = C.keys || [];
  if (!keys.length) throw new Error('Key Gemini belum dipasang (file local/gemini-keys.js).');
  DB.ai = DB.ai || {};
  let last = '';
  for (let i = 0; i < keys.length; i++) {
    const k = ((DB.ai.next || 0) + i) % keys.length;
    if ((aiRest[k] || 0) > Date.now()) continue;
    let res;
    try {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${C.model || 'gemini-3.1-flash-lite'}:generateContent`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': keys[k] },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: user }] }],
          generationConfig: { temperature: 0.4, maxOutputTokens: 8192, responseMimeType: 'application/json' } }) });
    } catch (e) { throw new Error('Tidak bisa menghubungi Gemini. Cek koneksi internet.'); }
    if (res.status === 429 || res.status === 403 || res.status >= 500) { aiRest[k] = Date.now() + 90000; last = `HTTP ${res.status}`; continue; }
    if (!res.ok) throw new Error(`Gemini menolak permintaan (HTTP ${res.status}).`);
    DB.ai.next = (k + 1) % keys.length;   // spread the load over the pool
    const j = await res.json(), cand = (j.candidates || [])[0] || {};
    const text = ((cand.content || {}).parts || []).map(p => p.text || '').join('').replace(/^\s*```(?:json)?|```\s*$/g, '');
    try { return JSON.parse(text); } catch (e) { throw new Error(`Jawaban Gemini tidak lengkap (${cand.finishReason || 'format salah'}). Coba lagi.`); }
  }
  throw new Error(`Semua key sedang kena limit (${last}). Coba lagi 1–2 menit lagi.`);
}

function fillStar(q) {
  if (!q.order) return q.stem;
  let k = 0;
  return q.stem.replace(/<span class="slot( star)?">(★)?<\/span>/g, (m, star) => {
    const o = q.opts[+q.order[k++] - 1] || '';
    return `<span class="slot fill${star ? ' star' : ''}">${o}</span>`;
  });
}
function fillPart(q) {            // narabe in progress: picked pieces sit in the first slots, tap one to take it back
  const got = S.part[q.id] || [];
  let k = 0;
  return q.stem.replace(/<span class="slot( star)?">(★)?<\/span>/g, m => {
    const i = k++;
    return i < got.length ? `<span class="slot pick" data-unslot="${i}">${q.opts[got[i] - 1]}</span>` : m;
  });
}
function fillBlank(q, html) {
  // an option like 券／券 fills several blanks in order
  const n = (html.match(/<span class="blank"><\/span>/g) || []).length;
  const parts = n > 1 ? q.opts[q.ans - 1].split('／') : [q.opts[q.ans - 1]];
  let k = 0;
  return html.replace(/<span class="blank"><\/span>/g, m => k < parts.length ? `<span class="blank fill">${parts[k++]}</span>` : m);
}

        <div class="instr"><span class="jp">${q.ins || T.jp}</span>${T.how}</div>
        ${q.audio ? `<div class="aud"><span class="ic"><svg><use href="#i-ear"/></svg></span><audio class="qa" data-q="${q.id}" controls preload="metadata" src="${q.audio}${q.t ? '#t=' + q.t : ''}"></audio></div>` : ''}
        <div class="stem ${q.type === 'youhou' ? 'word' : ''}">${stem}</div>
        ${q.img ? `<figure class="qimg"><img src="${q.img}" alt="Gambar soal"></figure>` : ''}
        ${nar && !done ? `<div class="narh"><span>${got.length}/4 terpasang</span>${got.length ? '<button data-act="unslot">Hapus terakhir</button>' : ''}</div>` : ''}
        <div class="opts ${short && q.type !== 'youhou' ? 'grid2' : ''}">${optsHtml}</div>
        <div id="exwrap" aria-live="polite">${done ? explain(q, picked) : ''}</div>
        <div class="qnav">
          <button class="btn" data-act="prev" ${S.i ? '' : 'disabled'}><svg><use href="#i-back"/></svg>Sebelumnya</button>
          <button class="btn ${done ? 'pri' : ''}" data-act="next">${isLast ? (done ? 'Lihat hasil' : 'Lewati & selesai') : (done ? 'Berikutnya' : 'Lewati')}<svg><use href="#i-next"/></svg></button>
        </div>
        <div class="kbd"><kbd>1</kbd>–<kbd>${Math.min(q.opts.length, 9)}</kbd> jawab${q.opts.length > 9 ? ' · klik pilihan 10 ke atas' : ''} · <kbd>Enter</kbd> lanjut · <kbd>←</kbd><kbd>→</kbd> pindah · <kbd>F</kbd> furigana</div>
      </section>
    </div>`;
  if (keepA) $('audio.qa').replaceWith(keepA);
  const np = $('.passage .ptext');
  if (np && sameP) np.scrollTop = pScroll;
  if (q.type === 'cloze' && np && !sameP) {
    const cur = $('.slot.num.cur', np);
    if (cur) np.scrollTop = Math.max(0, cur.offsetTop - np.clientHeight / 3);
  }
}

function explain(q, picked) {
  const ok = isOk(q, picked);
  const nar = q.type === 'narabe';
  const ex = q.ex || {};
  const key = nar ? q.order.split('').join('→') : lab(q, q.ans - 1) + (q.alt || []).map(a => ' / ' + lab(q, a - 1)).join('');
  let h = `<div class="verdict ${ok ? 'ok' : 'no'}"><svg><use href="#i-${ok ? 'ok' : 'no'}"/></svg>
    <div>${ok ? 'Benar!' : 'Belum tepat.'} <span>Jawabannya <b>${key}</b> — <span class="jp">${ansText(q)}</span></span></div></div>`;
  h += '<div class="ex">';
  if ((q.type === 'star' || nar) && q.order) {
    const chips = seq => seq.split('').map((d, k) => `<span class="c ${k === starPos(q) ? 's' : ''}">${strip(q.opts[+d - 1])}</span>`).join('<span class="ar">›</span>');
    h += `<div><h4>Urutan yang benar</h4><div class="box"><div class="order">${chips(q.order)}</div></div></div>`;
    if (nar && !ok) h += `<div><h4>Urutanmu</h4><div class="box"><div class="order">${chips(picked)}</div></div></div>`;
  }
  if (q.script) h += `<details class="scr" open><summary>Skrip audio</summary><div class="box">${q.script}</div></details>`;
  if (ex.tr) h += `<div><h4>Arti</h4><div class="box">${ex.tr}</div></div>`;
  if (ex.why) h += `<div><h4>Kenapa</h4><div class="box">${ex.why}</div></div>`;
  const notes = ex.opt || [];
  if (notes.some(Boolean)) {
    h += `<div><h4>Tiap pilihan</h4><div class="olist">${q.opts.map((o, k) => {
      const n = k + 1, right = !nar && isOk(q, n), mine = !nar && n === picked;
      const tag = nar ? `<span class="tag y">ke-${q.order.indexOf(String(n)) + 1}</span>` : (right ? '<span class="tag y">benar</span>' : '') + (mine && !right ? '<span class="tag m">pilihanmu</span>' : '');
      return `<div class="orow ${right ? 'right' : ''} ${mine ? 'mine' : ''}"><span class="k">${lab(q, k)}</span>
        <div><span class="ot">${o}${tag}</span>${notes[k] || ''}</div></div>`;
    }).join('')}</div></div>`;
  }
  if (!ex.why && !ex.tr) {
    let fb = 'Penjelasan untuk soal ini belum ditulis.';
    if (q.hint) fb += `<br>Kunci buku untuk pilihan lain: <span class="jp">${esc(q.hint)}</span>`;
    h += `<div class="box muted">${fb}</div>`;
  }
  return h + aiqBlock(q, picked) + '</div>';
}
function starPos(q) {
  const slots = q.stem.match(/<span class="slot( star)?">/g) || [];
  return slots.findIndex(s => s.includes('star'));
}

function pick(n) {
  const q = S.qs[S.i];
  if (S.ans[q.id] != null || !(n >= 1 && n <= q.opts.length)) return;
  if (q.type === 'narabe') {                 // collect pieces until all four are placed
    const got = S.part[q.id] = S.part[q.id] || [];
    if (got.includes(n)) return;
    got.push(n);
    if (got.length < q.opts.length) return renderQ();
    n = got.join('');
  }
  S.ans[q.id] = n;
  const prev = DB.hist[q.id], ok = isOk(q, n) ? 1 : 0;
  // f = first attempt, never overwritten (a later correct retry keeps the original mistake on record);
  // w = wrong attempts so far. Older entries have neither: their f is known only when n was 1.
  const f = prev ? firstOf(prev) : { c: n, ok, t: Date.now() };
  const w = (prev ? (prev.w != null ? prev.w : prev.ok ? 0 : 1) : 0) + (ok ? 0 : 1);
  DB.hist[q.id] = { ok, c: n, t: Date.now(), n: (prev ? prev.n : 0) + 1, b: S.B.id, f, w };
  if (S.setId && S.qs.every(x => S.ans[x.id] != null)) recordSet();
  save();
  renderQ();
  const ex = $('#exwrap');
  if (ex && ex.getBoundingClientRect().top > innerHeight * .7) ex.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function unslot(i) {                         // take a placed narabe piece back (-1 = the last one)
  const q = S.qs[S.i], got = S.part[q.id];
  if (S.ans[q.id] != null || !got || !got.length) return;
  got.splice(i < 0 ? got.length - 1 : i, 1);
  renderQ();
}
function recordSet() {
  const st = S.B.set[S.setId];
  const g = st.qs.filter(x => isOk(x, S.ans[x.id])).length;
  const r = DB.sets[S.setId] || {};
  DB.sets[S.setId] = { last: g, best: Math.max(g, r.best || 0), total: st.qs.length, t: Date.now() };
}
function go(i) { S.i = Math.max(0, Math.min(S.qs.length - 1, i)); renderQ(); window.scrollTo({ top: 0 }); }
function next() { if (S.i < S.qs.length - 1) go(S.i + 1); else summary(); }

function summary() {
  const g = S.qs.filter(x => isOk(x, S.ans[x.id])).length, n = S.qs.length;
  const pct = n ? g / n : 0, C = 2 * Math.PI * 64;
  const wrongQs = S.qs.filter(x => S.ans[x.id] != null && !isOk(x, S.ans[x.id]));
  const msg = pct >= .9 ? 'Luar biasa!' : pct >= .7 ? 'Bagus, tinggal sedikit lagi.' : pct >= .4 ? 'Lumayan — ulas yang salah, ya.' : 'Pelan-pelan saja, baca penjelasannya.';
  let nextSet = '';
  if (S.setId) {
    const st = S.B.set[S.setId], sets = st.part.sets, k = sets.indexOf(st);
    if (sets[k + 1]) nextSet = `<a class="btn pri" href="#/s/${S.B.id}/${sets[k + 1].id}">Set berikutnya<svg><use href="#i-next"/></svg></a>`;
  }
  setCrumb([`<a href="#/">Kotae</a>`, `<a class="jp" href="#/b/${S.B.id}">${esc(S.B.title)}</a>`, 'Hasil']);
  app.innerHTML = `<div class="sum panel">
    <div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle cx="75" cy="75" r="64" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg>
      <b>${g}/${n}</b></div>
    <h2>${msg}</h2>
    <p class="muted jp">${esc(S.title)}</p>
    <div class="acts">
      ${wrongQs.length ? '<button class="btn" data-act="redoWrong"><svg><use href="#i-redo"/></svg>Ulangi yang salah (' + wrongQs.length + ')</button>' : ''}
      <button class="btn" data-act="redoAll"><svg><use href="#i-redo"/></svg>Ulangi semua</button>
      ${nextSet}
      <a class="btn" href="${S.back}"><svg><use href="#i-book"/></svg>Kembali</a>
    </div>
    <div class="slist">${S.qs.map((x, k) => {
      const a = S.ans[x.id];
      return `<a href="#" data-review="${k}"><span class="m ${a == null ? '' : isOk(x, a) ? 'g' : 'r'}">${x.n}</span><span class="x">${strip(x.type === 'cloze' ? x.opts[x.ans - 1] : x.stem).slice(0, 80)}</span></a>`;
    }).join('')}</div></div>`;
  S.wrongQs = wrongQs;
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const t = e.target.closest('[data-pick],[data-go],[data-act],[data-review],[data-unslot],[data-ai],[data-aiq]');
  if (t && t.dataset.ai != null) return runAI();
  if (!t || !S) return;
  if (t.dataset.aiq != null) return runAIQ();
  if (t.dataset.pick) return pick(+t.dataset.pick);
  if (t.dataset.unslot) return unslot(+t.dataset.unslot);
  if (t.dataset.go) return go(+t.dataset.go);
  if (t.dataset.review) { e.preventDefault(); S.i = +t.dataset.review; renderQ(); window.scrollTo({ top: 0 }); return; }
  const a = t.dataset.act;
  if (a === 'next') return next();
  if (a === 'prev') return go(S.i - 1);
  if (a === 'unslot') return unslot(-1);
  if (a === 'toggleP') { const p = t.closest('.passage'); p.classList.toggle('shut'); t.textContent = p.classList.contains('shut') ? 'Buka' : 'Tutup'; return; }
  if (a === 'redoAll') return newSession(S.B, S.qs, S.title, S.crumb, S.back, S.setId);
  if (a === 'redoWrong') return newSession(S.B, S.wrongQs, 'Ulangi yang salah', S.crumb, S.back, null);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  if (e.key === 'f' || e.key === 'F') { $('#furiBtn').click(); return; }
  if (!S || !$('.qcard')) return;
  if (/^[1-9]$/.test(e.key)) { pick(+e.key); e.preventDefault(); }
  else if ((e.key === 'a' || e.key === 'b') && (TYPES[S.qs[S.i].type] || {}).ab) { pick(e.key === 'a' ? 1 : 2); e.preventDefault(); }
  else if (e.key === 'Backspace' && S.part[S.qs[S.i].id]) { unslot(-1); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === 'ArrowRight') { if (e.key === 'ArrowRight' || S.ans[S.qs[S.i].id] != null) { next(); e.preventDefault(); } }
  else if (e.key === 'ArrowLeft') { go(S.i - 1); e.preventDefault(); }
});

route();
})();
</script>
</body>
</html>
